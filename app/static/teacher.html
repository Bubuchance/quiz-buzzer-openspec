<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>老師控制台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <h1>老師控制台</h1>
    <div class="topbar-right">
      <span id="countdown" class="countdown" hidden aria-live="polite"></span>
      <span id="phase"></span>
      <span id="live" class="live off" title="即時連線狀態">連線中…</span>
      <button class="ghost" onclick="logout()">登出</button>
    </div>
  </header>

  <main class="wide">
    <section class="card controls" aria-label="搶答控制">
      <button id="btn-open" class="primary big">開啟搶答</button>
      <button id="btn-close" class="danger big">結束搶答</button>
      <button id="btn-reset" class="ghost">重設（清除作答）</button>
      <span class="spacer"></span>
      <button id="btn-writeback" class="primary">寫回 Google Sheets</button>
      <a id="btn-export-csv" class="button">匯出 CSV</a>
    </section>

    <div class="grid">
      <section class="card">
        <h2>1. 匯入 Guided Notes（雲端 Google Sheets）</h2>
        <div id="sheets-status" class="sheets-status" aria-live="polite">檢查 Google Sheets 設定中…</div>
        <p class="muted small">學習單需有「題號」「作答」欄位標題；題組在作答欄寫（1）（2）…，後續小題放在下方列、題號欄留空。</p>
        <form id="url-form" class="row">
          <input id="url" type="text" placeholder="貼上 Google Sheets 網址（https://docs.google.com/spreadsheets/d/...）" aria-label="Google Sheets 網址">
          <button type="submit">匯入</button>
        </form>
        <div id="questions"></div>
      </section>

      <section class="card">
        <h2>2. 設定</h2>
        <form id="settings-form">
          <label for="group-count">組數（1–20）</label>
          <input id="group-count" type="number" min="1" max="20">
          <label class="check"><input id="fair-mode" type="checkbox"> 公平模式：已成功越多題的組別，有效時間加上延遲</label>
          <label for="fair-delay">延遲量（每成功一題加幾秒，1–30）</label>
          <input id="fair-delay" type="number" min="1" max="30">
          <label for="time-limit">搶答時限（秒，0 = 不限時，最多 3600）</label>
          <input id="time-limit" type="number" min="0" max="3600">
          <button type="submit">儲存設定</button>
        </form>
        <h3>各組成員</h3>
        <ul id="members" class="members"></ul>
      </section>
    </div>

    <section class="card">
      <h2>3. 作答狀況與結果 <span id="provisional" class="muted small"></span></h2>
      <div id="results"><p class="muted">尚無資料</p></div>
    </section>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/teacher.js"></script>
</body>
</html>
