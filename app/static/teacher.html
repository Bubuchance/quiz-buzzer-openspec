<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>老師控制台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <h1>老師控制台</h1>
    <div class="topbar-right">
      <span id="phase"></span>
      <span id="live" class="live off" title="即時連線狀態">連線中…</span>
      <button class="ghost" onclick="logout()">登出</button>
    </div>
  </header>

  <main class="wide">
    <section class="card controls" aria-label="搶答控制">
      <button id="btn-open" class="primary big">開啟搶答</button>
      <button id="btn-close" class="danger big">結束搶答</button>
      <button id="btn-reset" class="ghost">重設（清除作答）</button>
      <span class="spacer"></span>
      <a id="btn-export-xlsx" class="button">匯出 Guided Notes（寫入答案）</a>
      <a id="btn-export-csv" class="button">匯出 CSV</a>
    </section>

    <div class="grid">
      <section class="card">
        <h2>1. 匯入 Guided Notes</h2>
        <p class="muted small">填空格請放佔位符：單題 <code>{{1}}</code>、題組 <code>{{3-1}}</code> <code>{{3-2}}</code>。</p>
        <form id="file-form" class="row">
          <input id="file" type="file" accept=".xlsx" aria-label="選擇 xlsx 檔案">
          <button type="submit">上傳 .xlsx</button>
        </form>
        <form id="url-form" class="row">
          <input id="url" type="url" placeholder="或貼上 Google Sheets 網址（需設為知道連結的人皆可檢視）" aria-label="Google Sheets 網址">
          <button type="submit">從網址匯入</button>
        </form>
        <div id="questions"></div>
      </section>

      <section class="card">
        <h2>2. 設定</h2>
        <form id="settings-form">
          <label for="group-count">組數（1–20）</label>
          <input id="group-count" type="number" min="1" max="20">
          <label class="check"><input id="fair-mode" type="checkbox"> 公平模式：時間窗內成功題數較少的組別優先</label>
          <label for="fair-window">時間窗（秒，1–30）</label>
          <input id="fair-window" type="number" min="1" max="30">
          <button type="submit">儲存設定</button>
        </form>
        <h3>各組成員</h3>
        <ul id="members" class="members"></ul>
      </section>
    </div>

    <section class="card">
      <h2>3. 作答狀況與結果 <span id="provisional" class="muted small"></span></h2>
      <div id="results"><p class="muted">尚無資料</p></div>
    </section>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/teacher.js"></script>
</body>
</html>
